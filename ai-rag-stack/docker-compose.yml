version: "3.9"

services:
  postgres:
    image: ankane/pgvector
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rag_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
